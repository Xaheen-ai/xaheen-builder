name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # Lint & Typecheck
  # ============================================================================
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint SDK
        run: npm run lint --workspace=@xalabaas/sdk

      - name: Typecheck SDK
        run: npm run typecheck --workspace=@xalabaas/sdk

  # ============================================================================
  # SDK Unit Tests
  # ============================================================================
  test-sdk:
    name: SDK Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SDK tests
        run: npm run test --workspace=@xalabaas/sdk

  # ============================================================================
  # Convex Tests
  # ============================================================================
  test-convex:
    name: Convex Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Convex tests
        run: npm run test:convex

  # ============================================================================
  # Contract Tests
  # ============================================================================
  test-contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [test-convex]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npx vitest run tests/contracts/ --reporter=verbose

  # ============================================================================
  # E2E Journey Tests
  # ============================================================================
  test-e2e:
    name: E2E Journey Tests
    runs-on: ubuntu-latest
    needs: [test-contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test tests/e2e

  # ============================================================================
  # Build SDK
  # ============================================================================
  build:
    name: Build SDK
    runs-on: ubuntu-latest
    needs: [lint, test-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run sdk:build

  # ============================================================================
  # Verification Report
  # ============================================================================
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-sdk, test-convex, test-contracts, test-e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate verification report
        run: |
          echo "# XalaBaaS Verification Report" > verification_report.md
          echo "" >> verification_report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> verification_report.md
          echo "" >> verification_report.md
          echo "## Job Results" >> verification_report.md
          echo "" >> verification_report.md
          echo "| Job | Status |" >> verification_report.md
          echo "|-----|--------|" >> verification_report.md
          echo "| SDK Tests | ${{ needs.test-sdk.result }} |" >> verification_report.md
          echo "| Convex Tests | ${{ needs.test-convex.result }} |" >> verification_report.md
          echo "| Contract Tests | ${{ needs.test-contracts.result }} |" >> verification_report.md
          echo "| E2E Tests | ${{ needs.test-e2e.result }} |" >> verification_report.md

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_report.md
          retention-days: 30

  # ============================================================================
  # Deploy (on main only)
  # ============================================================================
  deploy:
    name: Deploy to Convex
    runs-on: ubuntu-latest
    needs: [build, test-report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.test-report.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Convex
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
